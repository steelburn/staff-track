<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StaffTrack — Catalog Management</title>
    <link rel="stylesheet" href="/css/main.css">
    <script src="/theme.js"></script>
</head>

<body>
    <div class="app-layout">
        <!-- ═══ Sidebar ═══════════════════════════════════════════════════════ -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">📋</div>
                <span class="sidebar-title">StaffTrack</span>
            </div>

            <nav class="sidebar-nav" id="sidebar-nav">
                <!-- Navigation rendered by JS -->
            </nav>

            <div class="sidebar-footer">
                <div class="user-card" id="sidebar-user-card">
                    <!-- User info rendered by JS -->
                </div>
            </div>

            <button class="sidebar-toggle" id="sidebarToggle">◀</button>
        </aside>

        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- ═══ Main Content ═════════════════════════════════════════════════ -->
        <div class="main-content">
            <!-- Page Header -->
            <header class="page-header">
                <div class="page-header-top">
                    <div style="display:flex; align-items:center; gap:12px;">
                        <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
                        <div>
                            <h1 class="page-title">Catalog Management</h1>
                            <p class="page-subtitle">Manage and delete individual entries</p>
                        </div>
                    </div>
                    <div class="page-actions">
                        <button class="btn btn-secondary" id="theme-toggle" data-theme-toggle>
                            <span class="theme-icon">🌙</span>
                            <span class="theme-label">Dark</span>
                        </button>
                    </div>
                </div>

                <div class="toolbar">
                    <div class="view-toggle">
                        <button class="active" data-tab="staff">👤 Staff</button>
                        <button data-tab="projects">📁 Projects</button>
                    </div>
                    <div class="search-box" style="margin-left: auto;">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="catalog-search" class="input" placeholder="Search catalog...">
                    </div>
                </div>
            </header>

            <!-- Content Area -->
            <main class="content-area">
                <!-- Staff View -->
                <div id="catalog-staff-view">
                    <div class="section-header">
                        <h2 class="section-title">Staff Directory</h2>
                    </div>

                    <div class="table-container">
                        <div class="table-scroll">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Name</th>
                                        <th>Title</th>
                                        <th>Department</th>
                                        <th>Email</th>
                                        <th style="width: 80px;">Action</th>
                                    </tr>
                                </thead>
                                <tbody id="catalog-staff-tbody">
                                    <tr>
                                        <td colspan="5">
                                            <div class="loading-state">
                                                <div class="spinner"></div>
                                                <p>Loading staff...</p>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Projects View -->
                <div id="catalog-projects-view" style="display: none;">
                    <div class="section-header">
                        <h2 class="section-title">Project Catalog</h2>
                    </div>

                    <div class="table-container">
                        <div class="table-scroll">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>SOC</th>
                                        <th>Project Name</th>
                                        <th>Customer</th>
                                        <th style="width: 80px;">Action</th>
                                    </tr>
                                </thead>
                                <tbody id="catalog-projects-tbody">
                                    <tr>
                                        <td colspan="4">
                                            <div class="loading-state">
                                                <div class="spinner"></div>
                                                <p>Loading projects...</p>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="/auth.js"></script>
    <script src="/sidebar.js"></script>
    <script src="/toast.js"></script>
    <script src="/catalog.js"></script>
</body>

</html>
