<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StaffTrack — Org Chart</title>
    <link rel="stylesheet" href="/css/main.css?v=20260824e">
    <script src="/theme.js?v=20260824e"></script>
    <style>
        .orgchart-wrapper {
            position: relative;
            height: calc(100vh - 280px);
            min-height: 500px;
            overflow: auto;
            background: var(--color-bg-muted);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--space-4);
        }

        .zoom-controls {
            position: absolute;
            top: var(--space-4);
            right: var(--space-4);
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
            z-index: 10;
        }

        .zoom-btn {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-md);
            border: 1px solid var(--color-border);
            background: var(--color-bg-surface);
            color: var(--color-text-primary);
            font-size: var(--font-size-xl);
            font-weight: var(--font-weight-semibold);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-fast);
            box-shadow: var(--shadow-sm);
        }

        .zoom-btn:hover {
            background: var(--color-primary);
            border-color: var(--color-primary);
            color: var(--color-text-inverse);
        }

        .zoom-btn:active {
            transform: scale(0.95);
        }

        /* Org chart toolbar */
        .orgchart-toolbar {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            flex-wrap: wrap;
        }

        .orgchart-search {
            position: relative;
            display: flex;
            align-items: center;
        }

        .orgchart-search input {
            width: 220px;
            padding: 8px 72px 8px 12px;
            border-radius: var(--radius-md);
            border: 1px solid var(--color-border);
            background: var(--color-bg-surface);
            color: var(--color-text-primary);
            font-size: var(--font-size-sm);
            outline: none;
            transition: border-color var(--transition-fast);
        }

        .orgchart-search input:focus {
            border-color: var(--color-primary);
        }

        .search-status {
            position: absolute;
            right: 8px;
            font-size: var(--font-size-xs);
            color: var(--color-text-secondary);
            pointer-events: none;
        }

        /* d3-org-chart node cards */
        .oc-card {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--color-bg-surface);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            padding: 10px 12px;
            width: 230px;
            box-sizing: border-box;
            box-shadow: var(--shadow-sm);
            text-align: left;
            font-family: inherit;
        }

        .oc-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--color-primary);
            color: var(--color-text-inverse);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: var(--font-weight-semibold);
            font-size: 14px;
            flex-shrink: 0;
        }

        .oc-meta {
            min-width: 0;
            line-height: 1.3;
        }

        .oc-name {
            font-weight: var(--font-weight-semibold);
            font-size: 13px;
            color: var(--color-text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .oc-title {
            font-size: 11px;
            color: var(--color-text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .oc-dept {
            font-size: 10px;
            color: var(--color-text-muted, var(--color-text-secondary));
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>

<body>
    <div class="app-layout">
        <!-- ═══ Sidebar ═══════════════════════════════════════════════════════ -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">📋</div>
                <span class="sidebar-title">StaffTrack</span>
            </div>

            <nav class="sidebar-nav" id="sidebar-nav">
                <!-- Navigation rendered by JS -->
            </nav>

            <div class="sidebar-footer">
                <div class="user-card" id="sidebar-user-card">
                    <!-- User info rendered by JS -->
                </div>
            </div>

            <button class="sidebar-toggle" id="sidebarToggle">◀</button>
        </aside>

        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- ═══ Main Content ═════════════════════════════════════════════════ -->
        <div class="main-content">
            <!-- Page Header -->
            <header class="page-header">
                <div class="page-header-top">
                    <div style="display:flex; align-items:center; gap:12px;">
                        <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
                        <div>
                            <h1 class="page-title">Org Chart</h1>
                            <p class="page-subtitle">Visual representation of the reporting structure</p>
                        </div>
                    </div>
                    <div class="page-actions orgchart-toolbar">
                        <div class="orgchart-search">
                            <input type="search" id="chart-search" placeholder="Search staff..." autocomplete="off">
                            <span class="search-status" id="search-status"></span>
                        </div>
                        <button class="btn btn-secondary" id="btn-fit" title="Fit chart to screen">⤢ Fit</button>
                        <button class="btn btn-secondary" id="btn-expand-all" title="Expand all nodes">⊕ Expand all</button>
                        <button class="btn btn-secondary" id="btn-collapse-all" title="Collapse to root">⊖ Collapse all</button>
                        <button class="btn btn-secondary" id="theme-toggle" data-theme-toggle>
                            <span class="theme-icon">🌙</span>
                            <span class="theme-label">Dark</span>
                        </button>
                    </div>
                </div>
            </header>

            <!-- Content Area -->
            <main class="content-area">
                <div class="orgchart-wrapper" id="chart-container">
                    <!-- Org chart rendered by JS -->
                    <div class="loading-state">
                        <div class="spinner"></div>
                        <p>Loading org chart...</p>
                    </div>

                    <div class="zoom-controls">
                        <button id="btn-zoom-in" class="zoom-btn" title="Zoom In">+</button>
                        <button id="btn-zoom-out" class="zoom-btn" title="Zoom Out">−</button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- d3-org-chart (fork: https://github.com/steelburn/org-chart) -->
    <script src="/vendor/d3.v7.min.js?v=20260824e"></script>
    <script src="/vendor/d3-flextree.min.js?v=20260824e"></script>
    <script src="/vendor/d3-org-chart.min.js?v=20260824e"></script>
    <script src="/auth.js?v=20260824e"></script>
    <script src="/menu.js?v=20260824e"></script>
    <script src="/sidebar.js?v=20260824e"></script>
    <script src="/toast.js?v=20260824e"></script>
    <script src="/orgchart.js?v=20260824e"></script>
</body>

</html>
