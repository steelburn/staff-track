<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StaffTrack — Projects</title>
    <link rel="stylesheet" href="/css/main.css">
    <script src="/theme.js"></script>
    <style>
        .project-card {
            background: var(--color-bg-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: all var(--transition-slow);
        }

        .project-card:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--color-border-hover);
            transform: translateY(-2px);
        }

        .project-card-header {
            padding: var(--space-4) var(--space-5);
            border-bottom: 1px solid var(--color-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-3);
        }

        .project-card-meta {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            flex-wrap: wrap;
            min-width: 0;
        }

        .project-card-name {
            font-size: var(--font-size-md);
            font-weight: var(--font-weight-semibold);
            color: var(--color-text-primary);
        }

        .project-customer {
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
        }

        .project-card-staff {
            padding: var(--space-4) var(--space-5);
            min-height: 60px;
        }

        .staff-badge {
            display: inline-flex;
            align-items: center;
            gap: var(--space-3);
            background: var(--color-primary-light);
            border: 1px solid var(--color-primary);
            border-radius: var(--radius-md);
            padding: var(--space-2) var(--space-3);
            font-size: var(--font-size-sm);
            margin: var(--space-1);
        }

        .staff-badge-name {
            font-weight: var(--font-weight-semibold);
            color: var(--color-text-primary);
        }

        .staff-badge-role {
            font-size: var(--font-size-xs);
            color: var(--color-text-secondary);
        }

        .no-staff-label {
            color: var(--color-text-muted);
            font-size: var(--font-size-sm);
            font-style: italic;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: var(--space-4);
        }

        @media (max-width: 768px) {
            .projects-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="app-layout">
        <!-- ═══ Sidebar ═══════════════════════════════════════════════════════ -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">📋</div>
                <span class="sidebar-title">StaffTrack</span>
            </div>

            <nav class="sidebar-nav" id="sidebar-nav">
                <!-- Navigation rendered by JS -->
            </nav>

            <div class="sidebar-footer">
                <div class="user-card" id="sidebar-user-card">
                    <!-- User info rendered by JS -->
                </div>
            </div>

            <button class="sidebar-toggle" id="sidebarToggle">◀</button>
        </aside>

        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- ═══ Main Content ═════════════════════════════════════════════════ -->
        <div class="main-content">
            <!-- Page Header -->
            <header class="page-header">
                <div class="page-header-top">
                    <div style="display:flex; align-items:center; gap:12px;">
                        <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
                        <div>
                            <h1 class="page-title">Projects</h1>
                            <p class="page-subtitle">Project staffing overview</p>
                        </div>
                    </div>
                    <div class="page-actions">
                        <button class="btn btn-secondary" id="btn-export-projects">⬇ Export CSV</button>
                        <button class="btn btn-secondary" id="theme-toggle" data-theme-toggle>
                            <span class="theme-icon">🌙</span>
                            <span class="theme-label">Dark</span>
                        </button>
                    </div>
                </div>

                <div class="toolbar">
                    <div class="search-box">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="proj-search" class="input" placeholder="Search project / SOC...">
                    </div>
                    <div class="filter-group">
                        <label class="toggle">
                            <input type="checkbox" id="toggle-empty" checked>
                            <span class="toggle-track">
                                <span class="toggle-thumb"></span>
                            </span>
                            <span class="toggle-label">Hide unassigned</span>
                        </label>
                    </div>
                </div>
            </header>

            <!-- Content Area -->
            <main class="content-area">
                <!-- Project Count -->
                <div class="section-header">
                    <h2 class="section-title">Active Projects</h2>
                    <span class="section-count" id="proj-count">Loading...</span>
                </div>

                <!-- Project Cards -->
                <div id="projects-container" class="projects-grid">
                    <div class="loading-state" style="grid-column: 1 / -1;">
                        <div class="spinner"></div>
                        <p>Loading projects...</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="/auth.js"></script>
    <script src="/sidebar.js"></script>
    <script src="/toast.js"></script>
    <script src="/projects.js"></script>
</body>

</html>
