<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StaffTrack — Projects</title>
    <link rel="stylesheet" href="/css/main.css?v=20260824f">
    <script src="/theme.js?v=20260824d"></script>
</head>

<body>
    <div class="app-layout">
        <!-- ═══ Sidebar ═══════════════════════════════════════════════════════ -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">📋</div>
                <span class="sidebar-title">StaffTrack</span>
            </div>

            <nav class="sidebar-nav" id="sidebar-nav">
                <!-- Navigation rendered by JS -->
            </nav>

            <div class="sidebar-footer">
                <div class="user-card" id="sidebar-user-card">
                    <!-- User info rendered by JS -->
                </div>
            </div>

            <button class="sidebar-toggle" id="sidebarToggle">◀</button>
        </aside>

        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- ═══ Main Content ═════════════════════════════════════════════════ -->
        <div class="main-content">
            <!-- Page Header -->
            <header class="page-header">
                <div class="page-header-top">
                    <div style="display:flex; align-items:center; gap:12px;">
                        <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
                        <div>
                            <h1 class="page-title">Projects</h1>
                            <p class="page-subtitle">Project staffing overview</p>
                        </div>
                    </div>
                    <div class="page-actions">
                        <button class="btn btn-secondary" id="btn-export-projects">⬇ Export CSV</button>
                        <button class="btn btn-secondary" id="theme-toggle" data-theme-toggle>
                            <span class="theme-icon">🌙</span>
                            <span class="theme-label">Dark</span>
                        </button>
                    </div>
                </div>

                <div class="toolbar">
                    <div class="search-box">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="proj-search" class="input" placeholder="Search project / SOC...">
                    </div>
                    <div class="filter-group">
                        <label class="toggle">
                            <input type="checkbox" id="toggle-empty" checked>
                            <span class="toggle-track">
                                <span class="toggle-thumb"></span>
                            </span>
                            <span class="toggle-label">Hide unassigned</span>
                        </label>
                    </div>
                </div>
            </header>

            <!-- Content Area -->
            <main class="content-area">
                <!-- Project Count -->
                <div class="section-header">
                    <h2 class="section-title">Active Projects</h2>
                    <span class="section-count" id="proj-count">Loading...</span>
                </div>

                <!-- Project Cards -->
                <div id="projects-container" class="projects-grid">
                    <div class="loading-state" style="grid-column: 1 / -1;">
                        <div class="spinner"></div>
                        <p>Loading projects...</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="/auth.js?v=20260824d"></script>
    <script src="/menu.js?v=20260828a"></script>
    <script src="/sidebar.js?v=20260824d"></script>
    <script src="/toast.js?v=20260824d"></script>
    <script src="/projects.js?v=20260828d"></script>
</body>

</html>
