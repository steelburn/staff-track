<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StaffTrack — Login</title>
    <link rel="stylesheet" href="/css/main.css?v=20260824d">
    <script src="/theme.js?v=20260824d"></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: var(--space-4);
            background: var(--color-bg-base);
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background: var(--color-bg-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-xl);
            padding: var(--space-8);
            box-shadow: var(--shadow-lg);
        }

        .login-header {
            text-align: center;
            margin-bottom: var(--space-8);
        }

        .login-logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--color-primary), #8b5cf6);
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto var(--space-4);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
        }

        .login-title {
            font-size: var(--font-size-2xl);
            font-weight: var(--font-weight-bold);
            color: var(--color-text-primary);
            margin-bottom: var(--space-2);
        }

        .login-subtitle {
            font-size: var(--font-size-base);
            color: var(--color-text-secondary);
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: var(--space-5);
        }

        .login-form .form-group {
            gap: var(--space-2);
        }

        .login-form .form-label {
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-semibold);
            color: var(--color-text-secondary);
        }

        .login-form .input {
            padding: 14px 16px;
            font-size: var(--font-size-base);
        }

        .login-actions {
            margin-top: var(--space-2);
        }

        .login-actions .btn {
            width: 100%;
            padding: 14px;
            font-size: var(--font-size-base);
        }

        .login-error {
            padding: var(--space-3) var(--space-4);
            background: var(--color-danger-light);
            border: 1px solid var(--color-danger);
            border-radius: var(--radius-md);
            color: var(--color-danger);
            font-size: var(--font-size-sm);
            text-align: center;
            display: none;
        }

        .login-error.visible {
            display: block;
        }

        .login-footer {
            margin-top: var(--space-6);
            text-align: center;
        }

        .login-footer p {
            font-size: var(--font-size-sm);
            color: var(--color-text-muted);
        }

        /* Theme toggle in corner */
        .theme-toggle-wrapper {
            position: fixed;
            top: var(--space-4);
            right: var(--space-4);
        }

        @media (max-width: 480px) {
            .login-card {
                padding: var(--space-6);
            }

            .login-logo {
                width: 56px;
                height: 56px;
                font-size: 24px;
            }

            .login-title {
                font-size: var(--font-size-xl);
            }
        }
    </style>
</head>

<body>
    <!-- Theme Toggle -->
    <div class="theme-toggle-wrapper">
        <button class="btn btn-secondary btn-icon" id="theme-toggle" title="Toggle theme">
            <span class="theme-icon">🌙</span>
        </button>
    </div>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">📋</div>
                <h1 class="login-title">StaffTrack</h1>
                <p class="login-subtitle">Sign in to your account</p>
            </div>

            <form class="login-form" id="login-form">
                <div class="form-group">
                    <label class="form-label" for="login-email">Email Address</label>
                    <input type="email" id="login-email" class="input" placeholder="name@company.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label class="form-label" for="login-password">Password</label>
                    <input type="password" id="login-password" class="input" placeholder="Enter your password" required autocomplete="current-password">
                </div>

                <div id="login-error" class="login-error"></div>

                <div class="login-actions">
                    <button type="submit" class="btn btn-primary" id="btn-login">
                        Sign In
                    </button>
                </div>
            </form>

            <div class="login-footer">
                <p>Staff Management System</p>
            </div>
        </div>
    </div>

    <script src="/auth.js?v=20260824d"></script>
    <script src="/login.js?v=20260824d"></script>
</body>

</html>
